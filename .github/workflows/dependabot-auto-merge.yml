name: Dependabot auto-merge
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
jobs:
  call-workflow:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: yukihiko-shinoda/reusable-workflow-dependabot-auto-merge/.github/workflows/workflow.yml@18569fc413f61286617b037aa34605b4a38a4ce1  # v1.0.0
    secrets:
      AUTO_MERGE_APP_CLIENT_ID: ${{ secrets.AUTO_MERGE_APP_CLIENT_ID }}
      AUTO_MERGE_APP_PRIVATE_KEY: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
